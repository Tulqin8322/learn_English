<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Луғат ёдлаш ва тест дастури</title>
    <style>
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 650px;
            text-align: center;
            position: relative;
        }
        #app-container, #stats-container {
            display: none;
            padding-top: 10px;
        }
        textarea {
            width: 100%;
            height: 140px;
            margin-top: 10px;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ced4da;
            box-sizing: border-box;
            font-size: 15px;
            resize: vertical;
        }
        select, input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ced4da;
            font-size: 16px;
            margin-top: 10px;
            background-color: white;
            box-sizing: border-box;
        }
        button {
            background: #0d6efd;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 12px;
            transition: background 0.2s;
        }
        button:hover { background: #0b5ed7; }
        button:disabled { background: #adb5bd; cursor: not-allowed; opacity: 0.7; }
        .btn-secondary { background: #6c757d; }
        .btn-secondary:hover { background: #5c636a; }
        .btn-info { background: #0dcaf0; color: #000; font-weight: bold; }
        .btn-info:hover { background: #31d2f2; }
        .btn-mic { background: #198754; font-size: 18px; padding: 15px; }
        .btn-mic:hover { background: #157347; }
        .btn-mic.listening { background: #dc3545; animation: pulse 1.5s infinite; }
        
        .btn-audio-group { display: flex; gap: 6px; margin-top: 12px; justify-content: center; flex-wrap: wrap; }
        .btn-audio { background: #198754; width: auto; padding: 6px 12px; font-size: 13px; margin-top: 0; }
        .btn-audio:hover { background: #157347; }
        .btn-audio-seq { background: #0d6efd; }
        .btn-audio-seq:hover { background: #0b5ed7; }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .option-btn { background: #f8f9fa; color: #212529; border: 2px solid #dee2e6; margin-top: 0; padding: 15px 10px; font-size: 15px; }
        .option-btn:hover:not(:disabled) { background: #e9ecef; }
        
        .flashcard {
            background: #fff; border: 2px solid #0d6efd; border-radius: 12px; padding: 30px 20px;
            min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); transition: transform 0.2s;
        }
        .flashcard:hover { transform: translateY(-2px); }

        .matching-container { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .matching-column { display: flex; flex-direction: column; gap: 10px; }
        .match-btn { background: #f8f9fa; color: #212529; border: 2px solid #dee2e6; padding: 12px 10px; margin: 0; font-size: 15px; border-radius: 8px; cursor: pointer; transition: all 0.2s; word-break: break-word; }
        .match-btn:hover:not(:disabled) { background: #e9ecef; border-color: #adb5bd; }
        .match-btn.selected { background: #cfe2ff; border-color: #0d6efd; color: #084298; font-weight: bold; }
        .match-btn.correct { background: #d1e7dd !important; border-color: #198754 !important; color: #0f5132 !important; cursor: default; }
        .match-btn.wrong { background: #f8d7da !important; border-color: #dc3545 !important; color: #842029 !important; }

        .jumble-area { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 15px; min-height: 50px; }
        .letter-btn { background: #ffc107; color: #000; padding: 10px 15px; font-size: 20px; font-weight: bold; border-radius: 8px; cursor: pointer; border: none; width: auto; margin: 0; text-transform: lowercase; transition: transform 0.1s ease-in-out; }
        .letter-btn:active { transform: scale(0.9); }
        .answer-box { min-height: 60px; border: 2px dashed #ced4da; border-radius: 8px; margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; padding: 10px; }

        .file-upload-wrapper { background: #e9ecef; padding: 10px; border-radius: 8px; margin-top: 15px; font-size: 14px; }
        .word-card { font-size: 30px; font-weight: bold; color: #212529; margin-bottom: 10px; word-wrap: break-word; }
        .translation-card { font-size: 22px; color: #0d6efd; word-wrap: break-word; }
        .question-title { font-size: 17px; color: #6c757d; margin-bottom: 10px; }
        .test-question-box { font-size: 22px; font-weight: 500; color: #212529; background: #e9ecef; padding: 20px; border-radius: 10px; margin-bottom: 20px; text-align: left; }
        hr { border: 0; height: 2px; background: #dee2e6; margin: 20px 0; }
        
        .top-header-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 20px; width: 100%; }
        .group-badge, .score-badge { padding: 6px 12px; border-radius: 6px; font-size: 13px; font-weight: bold; display: inline-block; }
        .group-badge { background: #17a2b8; color: white; text-align: right; }
        .score-badge { background: #6c757d; color: white; text-align: left; }

        .timer-container { width: 100%; height: 6px; background: #e9ecef; border-radius: 3px; margin-top: 25px; overflow: hidden; display: none; }
        #timer-bar { height: 100%; background: #dc3545; width: 100%; }
        #feedback { font-size: 19px; font-weight: bold; margin-top: 15px; min-height: 30px; }
        
        .controls { display: flex; gap: 10px; margin-top: 20px; }

        /* Stats Styles */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 15px; }
        .stat-card { background: #f8f9fa; border: 1px solid #dee2e6; border-radius: 10px; padding: 15px; text-align: center; }
        .stat-card h3 { margin: 0; font-size: 24px; color: #0d6efd; }
        .stat-card p { margin: 5px 0 0 0; color: #6c757d; font-size: 13px; }
        .words-list-box { text-align: left; max-height: 220px; overflow-y: auto; border: 1px solid #ced4da; padding: 10px; border-radius: 8px; margin-top: 15px; background: #fafafa; }
        .word-stat-item { display: flex; justify-content: space-between; border-bottom: 1px dashed #dee2e6; padding: 6px 0; font-size: 14px; }
        .tab-btn-group { display: flex; gap: 5px; margin-top: 15px; }
        .tab-btn { flex: 1; padding: 8px; font-size: 13px; background: #e9ecef; color: #495057; border: 1px solid #ced4da; margin-top: 0; }
        .tab-btn.active { background: #0d6efd; color: white; border-color: #0d6efd; }

        /* Toggles */
        .mode-toggle { display: flex; gap: 10px; margin-bottom: 15px; background: #e9ecef; padding: 5px; border-radius: 10px; }
        .mode-toggle input { display: none; }
        .mode-toggle label { flex: 1; text-align: center; padding: 12px; cursor: pointer; border-radius: 8px; font-weight: bold; color: #495057; transition: 0.3s; margin: 0; }
        .mode-toggle input:checked + label { background: #0d6efd; color: white; box-shadow: 0 4px 10px rgba(13, 110, 253, 0.3); }

        .lang-toggle { display: flex; gap: 10px; margin-bottom: 20px; justify-content: center; }
        .lang-toggle label { background: #fff; border: 2px solid #dee2e6; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .lang-toggle input:checked + span { color: #0d6efd; }
        .lang-toggle input { display: none; }
        .lang-label.active { border-color: #0d6efd; background: #e9ecef; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/nosleep/0.12.0/NoSleep.min.js"></script>
</head>
<body>

<div id="setup-container" class="container">
    <h2 data-i18n="appTitle">Луғат ёдлаш ва тест дастури</h2>
    
    <!-- Тилни танлаш -->
    <div class="lang-toggle" id="language-selector">
        <label class="lang-label active" id="lbl-uz">
            <input type="radio" name="lang-select" value="uz" checked onchange="changeLang()"> 
            <span>🇺🇿 Ўзбек тили</span>
        </label>
        <label class="lang-label" id="lbl-ru">
            <input type="radio" name="lang-select" value="ru" onchange="changeLang()"> 
            <span>🇷🇺 Русский</span>
        </label>
    </div>

    <!-- Режимларни танлаш -->
    <div class="mode-toggle">
        <input type="radio" id="toggle-vocab" name="main-mode" value="vocab" checked onchange="switchMainMode()">
        <label for="toggle-vocab" data-i18n="modeVocab">📚 Луғат ёдлаш</label>
        
        <input type="radio" id="toggle-test" name="main-mode" value="test" onchange="switchMainMode()">
        <label for="toggle-test" data-i18n="modeTest">📝 Тест синови</label>
    </div>

    <!-- ЛУҒАТ ЁДЛАШ БЎЛИМИ -->

    let currentLang = 'uz';

    function t(key) {
        return i18n[currentLang][key] || key;
    }

    function changeLang() {
        currentLang = document.querySelector('input[name="lang-select"]:checked').value;
        document.getElementById('lbl-uz').classList.remove('active');
        document.getElementById('lbl-ru').classList.remove('active');
        document.getElementById(`lbl-${currentLang}`).classList.add('active');
        
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (i18n[currentLang][key]) {
                el.innerHTML = i18n[currentLang][key];
            }
        });
        
        document.getElementById('current-score-badge').innerText = `${t('scoreMain')} 0.0`;
        updateGroups();
        updateTestGroups();
    }

    function getTranslation(item) {
        if (!item) return '';
        if (currentLang === 'uz') return item.uz || item.ru || item.word;
        if (currentLang === 'ru') return item.ru || item.uz || item.word;
        return item.word;
    }

    function switchMainMode() {
        const isVocab = document.getElementById('toggle-vocab').checked;
        if (isVocab) {
            mainAppMode = 'vocab';
            document.getElementById('vocab-setup-section').style.display = 'block';
            document.getElementById('test-setup-section').style.display = 'none';
            document.getElementById('btn-stats').style.display = 'inline-block';
        } else {
            mainAppMode = 'test';
            document.getElementById('vocab-setup-section').style.display = 'none';
            document.getElementById('test-setup-section').style.display = 'block';
            document.getElementById('btn-stats').style.display = 'none';
        }
    }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    function cleanStringForCheck(str) { return str ? str.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()?'"]/g,"").replace(/\s{2,}/g," ").trim() : ""; }

    /* --- ЛУҒАТ ПАРСИНГИ ВА СТАТИСТИКАСИ --- */
    function getWordData(word) {
        let raw = localStorage.getItem('vocab_data_' + word);
        if (raw) { try { return JSON.parse(raw); } catch(e) {} }
        return { totalScore: 0, modeScores: {} };
    }
    function saveWordData(word, data) { localStorage.setItem('vocab_data_' + word, JSON.stringify(data)); }
    function logStudySession(word, durationSeconds, isCorrect) {
        let logs = JSON.parse(localStorage.getItem('vocab_logs') || '[]');
        logs.push({ timestamp: Date.now(), word: word, duration: durationSeconds, isCorrect: isCorrect });
        localStorage.setItem('vocab_logs', JSON.stringify(logs));
    }
    function getWordModeScore(word, mode) {
        let data = getWordData(word);
        return data.modeScores[mode] || 0;
    }
    function updateWordScore(word, mode, isCorrect) {
        let data = getWordData(word);
        let currentModeScore = data.modeScores[mode] || 0;
        if (isCorrect) { currentModeScore = Math.min(1.0, currentModeScore + 0.1); } 
        else { currentModeScore = Math.max(0.0, currentModeScore - 0.1); }
        data.modeScores[mode] = parseFloat(currentModeScore.toFixed(2));
        let sum = Object.values(data.modeScores).reduce((acc, val) => acc + val, 0);
        data.totalScore = parseFloat(sum.toFixed(2));
        saveWordData(word, data);
        let currentWordObj = words.find(w => w.word === word);
        if(currentWordObj) currentWordObj.score = data.totalScore;
    }
    function resetScores() {
        if(confirm(t('alertResetConfirm'))) {
            Object.keys(localStorage).forEach(key => {
                if (key.startsWith('vocab_data_') || key === 'vocab_logs') { localStorage.removeItem(key); }
            });
            updateGroups();
            alert(t('alertResetSuccess'));
        }
    }

    function updateGroups() {
        const text = document.getElementById('word-list').value;
        const lines = text.split('\n').map(line => line.trim()).filter(line => line.includes('='));
        let groups = new Set();
        allParsedWords = [];

        lines.forEach(line => {
            const parts = line.split('=').map(p => p.trim());
            let word = '', uz = '', ru = '', group = t('allGroups'), subgroup = 'Асосий';
            if (parts.length >= 5) { word = parts[0]; uz = parts[1]; ru = parts[2]; group = parts[3] || t('allGroups'); subgroup = parts[4] || 'Асосий'; } 
            else if (parts.length === 4) { word = parts[0]; uz = parts[1]; ru = parts[2]; group = parts[3] || t('allGroups'); } 
            else if (parts.length === 3) { word = parts[0]; uz = parts[1]; group = parts[2] || t('allGroups'); } 
            else if (parts.length === 2) { word = parts[0]; uz = parts[1]; }

            if (word && (uz || ru)) {
                let wData = getWordData(word);
                allParsedWords.push({ word, uz, ru, group, subgroup, score: wData.totalScore });
                groups.add(group);
            }
        });

        const groupSelect = document.getElementById('group-select');
        groupSelect.innerHTML = `<option value="all">${t('allGroups')}</option>`;
        groups.forEach(g => {
            const opt = document.createElement('option');
            opt.value = g; opt.innerText = g;
            groupSelect.appendChild(opt);
        });
        updateSubgroups();
    }

    function updateSubgroups() {
        const selectedGroup = document.getElementById('group-select').value;
        const subgroupSelect = document.getElementById('subgroup-select');
        subgroupSelect.innerHTML = `<option value="all">${t('allSubgroups')}</option>`;
        let filtered = (selectedGroup === 'all') ? allParsedWords : allParsedWords.filter(w => w.group === selectedGroup);
        let subgroups = new Set(filtered.map(w => w.subgroup).filter(Boolean));
        subgroups.forEach(sg => {
            const opt = document.createElement('option');
            opt.value = sg; opt.innerText = sg;
            subgroupSelect.appendChild(opt);
        });
    }

    /* --- ТЕСТ ПАРСИНГИ --- */
    function updateTestGroups() {
        const text = document.getElementById('test-list').value;
        const lines = text.split('\n').map(line => line.trim()).filter(line => line.includes('='));
        let groups = new Set();
        allParsedTests = [];

        lines.forEach(line => {
            let safeLine = line.replace(/=>/g, '|||');
            const parts = safeLine.split('=');
            if (parts.length >= 3) {
                let question = parts[0].trim();
                let optionsStr = parts[1].trim(); 
                let fullSentence = parts[2].trim();
                let group = (parts.length > 3 && parts[3]) ? parts[3].replace(/^"|"$/g, '').trim() : t('allGroups');
                let subgroup = (parts.length > 4 && parts[4]) ? parts[4].replace(/^"|"$/g, '').trim() : 'Асосий';

                let options = optionsStr.split('|||').map(o => o.trim()).filter(Boolean);
                if(options.length > 0) {
                    let correctAnswer = options[0];
                    allParsedTests.push({ question, options, correctAnswer, fullSentence, group, subgroup });
                    groups.add(group);
                }
            }
        });

        const groupSelect = document.getElementById('test-group-select');
        groupSelect.innerHTML = `<option value="all">${t('allGroups')}</option>`;
        groups.forEach(g => {
            const opt = document.createElement('option');
            opt.value = g; opt.innerText = g;
            groupSelect.appendChild(opt);
        });
        updateTestSubgroups();
    }

    function updateTestSubgroups() {
        const selectedGroup = document.getElementById('test-group-select').value;
        const subgroupSelect = document.getElementById('test-subgroup-select');
        subgroupSelect.innerHTML = `<option value="all">${t('allSubgroups')}</option>`;
        let filtered = (selectedGroup === 'all') ? allParsedTests : allParsedTests.filter(t => t.group === selectedGroup);
        let subgroups = new Set(filtered.map(t => t.subgroup).filter(Boolean));
        subgroups.forEach(sg => {
            const opt = document.createElement('option');
            opt.value = sg; opt.innerText = sg;
            subgroupSelect.appendChild(opt);
        });
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }
    function sortWordsByCurrentModeScore(array, mode) {
        array.sort((a, b) => {
            let scoreA = getWordModeScore(a.word, mode);
            let scoreB = getWordModeScore(b.word, mode);
            return (scoreA - scoreB) || (Math.random() - 0.5);
        });
    }

    function startApp() {
        if (mainAppMode === 'vocab') {
            const selectedGroup = document.getElementById('group-select').value;
            const selectedSubgroup = document.getElementById('subgroup-select').value;
            currentMode = document.getElementById('mode-select').value;
            
            allParsedWords.forEach(w => w.score = getWordData(w.word).totalScore);
            words = allParsedWords.filter(item => {
                let matchGroup = (selectedGroup === 'all' || item.group === selectedGroup);
                let matchSubgroup = (selectedSubgroup === 'all' || item.subgroup === selectedSubgroup);
                return matchGroup && matchSubgroup;
            });
            
            if (words.length === 0) { alert(t('alertNoWords')); return; }

            currentIndex = 0;
            marathonBatchIndex = 0;
            currentMarathonStepIdx = 0;
            matchingBatchIndex = 0;

            if (currentMode === 'marathon') { batchWords = words.slice(marathonBatchIndex, marathonBatchIndex + 10); } 
            else { sortWordsByCurrentModeScore(words, currentMode); }
            
        } else if (mainAppMode === 'test') {
            const selectedGroup = document.getElementById('test-group-select').value;
            const selectedSubgroup = document.getElementById('test-subgroup-select').value;

            activeTests = allParsedTests.filter(item => {
                let matchGroup = (selectedGroup === 'all' || item.group === selectedGroup);
                let matchSubgroup = (selectedSubgroup === 'all' || item.subgroup === selectedSubgroup);
                return matchGroup && matchSubgroup;
            });

            if (activeTests.length === 0) { alert(t('alertNoTests')); return; }
            
            shuffleArray(activeTests);
            testCurrentIndex = 0;
            testCorrectCount = 0;
            testTotalCount = 0;
        }

        document.getElementById('setup-container').style.display = 'none';
        document.getElementById('app-container').style.display = 'block';
        
        try { noSleep.enable(); } catch(e) {}
        
        if (mainAppMode === 'vocab') { showNextWord(); } 
        else { showNextTest(); }
    }

    /* --- ОВОЗ ФУНКЦИЯЛАРИ --- */
    function getBestVoice(lang) {
        const voices = window.speechSynthesis.getVoices();
        if (voices.length === 0) return null;
        let availableVoices = voices.filter(v => v.lang.startsWith(lang));
        if (availableVoices.length > 0) {
            let bestVoice = availableVoices.find(v => 
                v.name.toLowerCase().includes('google') || 
                v.name.toLowerCase().includes('network') || 
                v.name.toLowerCase().includes('premium')
            );
            return bestVoice || availableVoices[0]; 
        }
        return null;
    }
    function speakText(text, lang = 'en-US') {
        if (!('speechSynthesis' in window) || !text) return;
        try {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = lang;
            utterance.rate = 0.85; 
            const voice = getBestVoice(lang.substring(0, 2));
            if (voice) { utterance.voice = voice; }
            window.speechSynthesis.speak(utterance);
        } catch(e) {}
    }
    function speakCurrentWordByLang(lang) {
        let activePool = (currentMode === 'marathon') ? batchWords : words;
        let item = activePool[currentIndex];
        if (!item) return;
        if (lang === 'en') speakText(item.word, 'en-US');
        if (lang === 'ru') speakText(item.ru, 'ru-RU');
        if (lang === 'uz') speakText(item.uz, 'uz-UZ');
    }
    function speakSequence(wordObj) {
        if (!('speechSynthesis' in window) || !wordObj) return;
        window.speechSynthesis.cancel();
        const enSpeech = new SpeechSynthesisUtterance(wordObj.word);
        enSpeech.lang = 'en-US'; enSpeech.rate = 0.85;
        let enVoice = getBestVoice('en');
        if (enVoice) enSpeech.voice = enVoice;

        let transText = currentLang === 'ru' ? wordObj.ru : wordObj.uz;
        let transLang = currentLang === 'ru' ? 'ru-RU' : 'uz-UZ';
        
        const transSpeech = transText ? new SpeechSynthesisUtterance(transText) : null;
        if (transSpeech) { 
            transSpeech.lang = transLang; transSpeech.rate = 0.85; 
            let tVoice = getBestVoice(transLang.substring(0, 2));
            if (tVoice) transSpeech.voice = tVoice;
        }

        enSpeech.onend = () => { if (transSpeech) setTimeout(() => window.speechSynthesis.speak(transSpeech), 300); };
        window.speechSynthesis.speak(enSpeech);
    }
    function processNext() {
        if (mainAppMode === 'test') { testCurrentIndex++; showNextTest(); } 
        else { currentIndex++; showNextWord(); }
    }

    /* =========================================
       2. ЛУҒАТ ЁДЛАШ БЎЛИМИ

    function showNextWord() {
        if (timer) clearTimeout(timer);
        if (speedRunTimer) { clearInterval(speedRunTimer); speedRunTimer = null; }
        if (activeRecognition) { try { activeRecognition.stop(); } catch(e){} activeRecognition = null; }
        
        document.getElementById('timer-wrapper').style.display = 'none';
        document.getElementById('feedback').innerHTML = '';
        let runMode = currentMode;

        if (currentMode === 'marathon') {
            let activePool = batchWords;
            if (currentIndex >= activePool.length) {
                currentIndex = 0; currentMarathonStepIdx++; 
                if (currentMarathonStepIdx >= marathonSteps.length) {
                    currentMarathonStepIdx = 0; marathonBatchIndex += 10;
                    batchWords = words.slice(marathonBatchIndex, marathonBatchIndex + 10);

        } 
        else if (currentMode === 'mix') {
            const mixModes = ['flashcard', 'matching', 'test-wt', 'test-tw', 'truefalse', 'jumble', 'type', 'speak'];
            runMode = mixModes[Math.floor(Math.random() * mixModes.length)];
        }

        if (runMode === 'matching') { wordStartTime = Date.now(); renderMatchingGame(); return; }
        if (runMode === 'speedrun') { wordStartTime = Date.now(); renderSpeedRun(); return; }

        let activePool = (currentMode === 'marathon') ? batchWords : words;
        if (currentMode !== 'marathon' && currentIndex >= activePool.length) {
            currentIndex = 0; sortWordsByCurrentModeScore(activePool, runMode);
        }

        const item = activePool[currentIndex];
        wordStartTime = Date.now();
        let displayTranslation = getTranslation(item);

        if (currentMode !== 'marathon') { document.getElementById('current-group-badge').innerText = item.group + (item.subgroup ? ` > ${item.subgroup}` : ''); }
        let mScore = getWordModeScore(item.word, runMode);
        document.getElementById('current-score-badge').innerText = `${t('scoreTotal')}: ${item.score.toFixed(1)} | ${t('scoreTest')}: ${mScore.toFixed(1)}`; 

        if (runMode === 'learn') {
            let langBtnName = currentLang === 'ru' ? 'RUS' : 'UZ';
            document.getElementById('dynamic-area').innerHTML = `
                <div class="word-card">${escapeHtml(item.word)}</div>
                <hr>
                <div class="translation-card">${escapeHtml(displayTranslation)}</div>
                <div class="btn-audio-group">
                    <button class="btn-audio" onclick="speakCurrentWordByLang('en')">${t('btnEng')}</button>
                    <button class="btn-audio" onclick="speakCurrentWordByLang('${currentLang}')">🔊 ${langBtnName}</button>
                    <button class="btn-audio btn-audio-seq" onclick="speakSequence(words[currentIndex])">${t('btnAllSeq')}</button>
                </div>
            `;
            speakSequence(item);
            let delay = calculateDelay(item.word, displayTranslation);
            showTimer(delay); timer = setTimeout(processNext, delay);
        }
        else if (runMode === 'flashcard') { renderFlashcard(item); }
        else if (runMode === 'test-wt') { renderMultipleChoice(item, true); } 
        else if (runMode === 'test-tw') { renderMultipleChoice(item, false); }
        else if (runMode === 'truefalse') { renderTrueFalse(item); }
        else if (runMode === 'jumble') { renderJumble(item); }
        else if (runMode === 'type') { renderTypeTest(item); }
        else if (runMode === 'speak') { renderSpeakTest(item); }
    }

    function calculateDelay(word, translation) {
        const maxLength = Math.max(word.length, (translation || '').length);
        if (maxLength <= 10) return 3000;
        if (maxLength <= 20) return 6000;
        if (maxLength <= 30) return 10000;
        return 15000;
    }
    function recordStudyDuration(word, isCorrect) {

    function handleMatchClick(btn) {

            if (selectedWordBtn) selectedWordBtn.classList.remove('selected');

        } else {
            if (selectedTranslationBtn) selectedTranslationBtn.classList.remove('selected');
            selectedTranslationBtn = btn; selectedTranslationBtn.classList.add('selected');
        }
        if (selectedWordBtn && selectedTranslationBtn) {
            let wWord = selectedWordBtn.getAttribute('data-id'); let tWord = selectedTranslationBtn.getAttribute('data-word');

            selectedWordBtn = null; selectedTranslationBtn = null;

            if (wWord === tWord) {
                wBtn.classList.remove('selected'); tBtn.classList.remove('selected');
                wBtn.classList.add('correct'); tBtn.classList.add('correct');

                recordStudyDuration(wWord, true); updateWordScore(wWord, 'matching', true); matchingPairsLeft--;

                    document.getElementById('feedback').innerHTML = `<span style="color: #198754;">${t('matchSuccess')}</span>`;

                        if (currentMode === 'marathon') { currentIndex = batchWords.length; processNext(); } 
                        else { matchingBatchIndex += 10; renderMatchingGame(); }

                }
            } else {
                wBtn.classList.remove('selected'); tBtn.classList.remove('selected');
                wBtn.classList.add('wrong'); tBtn.classList.add('wrong'); wBtn.disabled = true; tBtn.disabled = true;
                recordStudyDuration(wWord, false); updateWordScore(wWord, 'matching', false);
                setTimeout(() => { wBtn.classList.remove('wrong'); tBtn.classList.remove('wrong'); wBtn.disabled = false; tBtn.disabled = false; }, 2000);

    function generateOptions(correctItem, isWordToTranslation) {
        let activePool = (currentMode === 'marathon') ? batchWords : words;
        let options = [correctItem];
        let usedTexts = new Set();
        usedTexts.add(isWordToTranslation ? getTranslation(correctItem) : correctItem.word);
        let pool = activePool.filter(w => w.word !== correctItem.word && getTranslation(w) !== getTranslation(correctItem));
        if (pool.length < 3) { pool = allParsedWords.filter(w => w.word !== correctItem.word && getTranslation(w) !== getTranslation(correctItem)); }
        shuffleArray(pool);
        for (let i = 0; i < pool.length; i++) {
            if (options.length >= 4) break;
            let currentText = isWordToTranslation ? getTranslation(pool[i]) : pool[i].word;
            if (!usedTexts.has(currentText)) { options.push(pool[i]); usedTexts.add(currentText); }
        }
        shuffleArray(options);
        return options;
    }

    function getPartsForWord(word) {
        if (word.length <= 15) { return word.split(''); } 
        else {
            let result = []; let tokens = word.split(/(\s+)/);
            tokens.forEach(token => {
                if (token.trim() === '') { token.split('').forEach(spaceChar => result.push(spaceChar)); } 
                else {
                    const matches = token.match(/[^aeiouy]*[aeiouy]+(?:[^aeiouy]*$|[^aeiouy](?=[^aeiouy]))?/gi);
                    if (matches && matches.join('') === token) { result.push(...matches); } 
                    else { result.push(...(token.match(/.{1,4}/g) || [token])); }
                }
            });
            return result;
        }
    }

            html += `<button class="letter-btn" id="jumble-btn-${index}" onclick="handleJumbleClick(${index})">${displayPart}</button>`;

    function renderTypeTest(item) {
        let html = `

        `;
        document.getElementById('dynamic-area').innerHTML = html;
        setTimeout(() => { const input = document.getElementById('type-input'); if(input) { input.focus(); input.addEventListener('keypress', function (e) { if (e.key === 'Enter') { handleTypeSubmit(); } }); } }, 100);
    }
    function handleTypeSubmit() {
        let activePool = (currentMode === 'marathon') ? batchWords : words;
        let item = activePool[currentIndex]; const userAnswer = document.getElementById('type-input').value;
        checkAnswer(userAnswer, item.word, item.word, item.word, getTranslation(item), 'type');
    }

    function renderSpeakTest(item) {
        let html = `
            <div class="question-title">${t('speakTitle')}</div>
            <div class="translation-card">${escapeHtml(getTranslation(item))}</div>
            <button id="mic-btn" class="btn-mic" onclick="startMicTest()">🎤 ${t('btnMic')}</button>
        `;
        document.getElementById('dynamic-area').innerHTML = html;
    }
    function startMicTest() {
        let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) { alert("Кечирасиз, браузерингиз овозли қидирувни қўллаб-қувватламайди."); return; }
        if (activeRecognition) { try { activeRecognition.stop(); } catch(e){} }
        let activePool = (currentMode === 'marathon') ? batchWords : words;
        let item = activePool[currentIndex];

        activeRecognition = new SpeechRecognition(); activeRecognition.lang = 'en-US'; activeRecognition.continuous = false; activeRecognition.interimResults = false;
        const micBtn = document.getElementById('mic-btn');
        micBtn.innerText = '🎙 ...'; micBtn.classList.add('listening');
        activeRecognition.start();
        activeRecognition.onresult = function(event) {
            const spokenWord = event.results[0][0].transcript;
            micBtn.innerHTML = `🎤 ${t('btnMic')}`; micBtn.classList.remove('listening');
            checkAnswer(spokenWord, item.word, item.word, item.word, getTranslation(item), 'speak');
        };
        activeRecognition.onerror = function() { micBtn.innerHTML = `🎤 ${t('btnMic')}`; micBtn.classList.remove('listening'); };
        activeRecognition.onend = function() { micBtn.innerHTML = `🎤 ${t('btnMic')}`; micBtn.classList.remove('listening'); };
    }

    function checkAnswer(rawUserAnswer, rawMatchAnswer, displayAnswer, itemWord, itemTranslation, testModeKey) {
        const dynamicBtns = document.querySelectorAll('#dynamic-area button, #dynamic-area input');
        dynamicBtns.forEach(b => b.disabled = true);
        const userAnswer = cleanStringForCheck(rawUserAnswer); const matchAnswer = cleanStringForCheck(rawMatchAnswer);
        const feedback = document.getElementById('feedback');
        
        let isCorrect = (userAnswer === matchAnswer);
        recordStudyDuration(itemWord, isCorrect); updateWordScore(itemWord, testModeKey || currentMode, isCorrect);
        
        let mScore = getWordModeScore(itemWord, testModeKey || currentMode);
        document.getElementById('current-score-badge').innerText = `${t('scoreTotal')}: ${getWordData(itemWord).totalScore.toFixed(1)} | ${t('scoreTest')}: ${mScore.toFixed(1)}`;

        if (isCorrect) {
            feedback.innerHTML = `<span style="color: #198754;">${t('msgGreat')}</span>`;
            timer = setTimeout(processNext, 1200); 
        } else {
            speakText(itemWord, 'en-US');
            let youSaid = rawUserAnswer ? `<br><span style="font-size:16px; color:#6c757d;">${t('msgYourAnswer')} ${escapeHtml(rawUserAnswer)}</span>` : '';
            feedback.innerHTML = `<span style="color: #dc3545;">${t('msgWrong')}</span><br><span style="color:#212529; font-size:18px;">${t('msgCorrectAnswer')} <b>${escapeHtml(displayAnswer)}</b></span>${youSaid}`;
            let delay = calculateDelay(itemWord, itemTranslation);
            showTimer(delay); timer = setTimeout(processNext, delay);
        }
    }

    function showTimer(duration) {
        const wrapper = document.getElementById('timer-wrapper'); const bar = document.getElementById('timer-bar');
        wrapper.style.display = 'block'; bar.style.transition = 'none'; bar.style.width = '100%';
        setTimeout(() => { bar.style.transition = `width ${duration}ms linear`; bar.style.width = '0%'; }, 50);
    }

    function stopApp() {
        if (timer) clearTimeout(timer); if (speedRunTimer) { clearInterval(speedRunTimer); speedRunTimer = null; }
        if (activeRecognition) { try { activeRecognition.stop(); } catch(e){} activeRecognition = null; }
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        try { noSleep.disable(); } catch(e){}
        document.getElementById('app-container').style.display = 'none';
        document.getElementById('setup-container').style.display = 'block';
    }

    function openStats() { document.getElementById('setup-container').style.display = 'none'; document.getElementById('stats-container').style.display = 'block'; renderStats('today'); }
    function closeStats() { document.getElementById('stats-container').style.display = 'none'; document.getElementById('setup-container').style.display = 'block'; }
    function switchStatsPeriod(period, btn) { document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); renderStats(period); }
    function renderStats(period) {
        let logs = JSON.parse(localStorage.getItem('vocab_logs') || '[]'); let now = Date.now(); let timeThreshold = 0;
        if (period === 'today') { let startOfToday = new Date(); startOfToday.setHours(0,0,0,0); timeThreshold = startOfToday.getTime(); } 
        else if (period === 'week') { timeThreshold = now - (7 * 24 * 3600 * 1000); } 
        else if (period === 'month') { timeThreshold = now - (30 * 24 * 3600 * 1000); } 
        else if (period === 'year') { timeThreshold = now - (365 * 24 * 3600 * 1000); }

        let filteredLogs = logs.filter(l => l.timestamp >= timeThreshold);
        let totalSeconds = filteredLogs.reduce((sum, l) => sum + (l.duration || 0), 0);
        let minutes = Math.floor(totalSeconds / 60); let hours = (minutes / 60).toFixed(1);
        
        document.getElementById('stat-time').innerText = minutes < 60 ? `${minutes} ${currentLang === 'ru' ? 'мин' : 'дақ'}` : `${hours} ${currentLang === 'ru' ? 'час' : 'соат'}`;
        let uniqueWords = new Set(filteredLogs.map(l => l.word));
        document.getElementById('stat-words-count').innerText = `${uniqueWords.size} ${currentLang === 'ru' ? 'шт' : 'та'}`;

        let listContainer = document.getElementById('stats-words-list'); listContainer.innerHTML = '';
        if (uniqueWords.size === 0) { listContainer.innerHTML = `<div style="text-align:center; color:#6c757d; padding:20px;">${t('statNoData')}</div>`; return; }

        uniqueWords.forEach(wordStr => {
            let wData = getWordData(wordStr); let itemObj = allParsedWords.find(w => w.word === wordStr);
            let translation = itemObj ? getTranslation(itemObj) : ''; let itemDiv = document.createElement('div');
            itemDiv.className = 'word-stat-item';
            itemDiv.innerHTML = `<div><b>${escapeHtml(wordStr)}</b> <span style="color:#6c757d; font-size:12px;">(${escapeHtml(translation)})</span></div><div><span style="background:#e9ecef; padding:2px 6px; border-radius:4px; font-weight:bold; color:#0d6efd;">${t('scoreMain')} ${wData.totalScore.toFixed(1)}</span></div>`;
            listContainer.appendChild(itemDiv);
        });
    }
</script>
